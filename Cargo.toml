[workspace]
members = [
    "catalogs/iceberg-file-catalog",
    "catalogs/iceberg-glue-catalog",
    "catalogs/iceberg-rest-catalog",
    "catalogs/iceberg-s3tables-catalog",
    "catalogs/iceberg-sql-catalog",
    "datafusion-iceberg-sql",
    "datafusion_iceberg",
    "iceberg-rust",
    "iceberg-rust-spec",
]

resolver = "2"

[workspace.dependencies]
apache-avro = "0.21"
arrow = "58"
arrow-schema = "58"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = [
    "serde",
    "clock",
] }
#Official Releases
#datafusion = "54"
#datafusion-common = "54"
#datafusion-execution = "54"
#datafusion-expr = "54"
#datafusion-functions = { version = "54", features = ["crypto_expressions"] }
#datafusion-functions-aggregate = "54"
#datafusion-sql = "54"

#Fork (andts/datafusion, rebased onto 54.0.0)
datafusion = { version = "54", features = ["backtrace", ], git = "https://github.com/andts/datafusion.git", rev = "73c53eff45059a04a60a649a27b13481047f48f8" }
datafusion-common = { version = "54", git = "https://github.com/andts/datafusion.git", rev = "73c53eff45059a04a60a649a27b13481047f48f8" }
datafusion-execution = { version = "54", git = "https://github.com/andts/datafusion.git", rev = "73c53eff45059a04a60a649a27b13481047f48f8" }
datafusion-expr = { version = "54", git = "https://github.com/andts/datafusion.git", rev = "73c53eff45059a04a60a649a27b13481047f48f8" }
datafusion-functions = { version = "54", features = ["crypto_expressions"], git = "https://github.com/andts/datafusion.git", rev = "73c53eff45059a04a60a649a27b13481047f48f8" }
datafusion-functions-aggregate = { version = "54", git = "https://github.com/andts/datafusion.git", rev = "73c53eff45059a04a60a649a27b13481047f48f8" }
datafusion-sql = { version = "54", git = "https://github.com/andts/datafusion.git", rev = "73c53eff45059a04a60a649a27b13481047f48f8" }

#Local Changes (active for local development against the andts-datafusion checkout)
#datafusion = { version = "54", features = ["backtrace", ], path = "../andts-datafusion/datafusion/core" }
#datafusion-common = { version = "54", path = "../andts-datafusion/datafusion/common"  }
#datafusion-execution = { version = "54", path = "../andts-datafusion/datafusion/execution" }
#datafusion-expr = { version = "54", path = "../andts-datafusion/datafusion/expr" }
#datafusion-functions = { version = "54", features = ["crypto_expressions"], path = "../andts-datafusion/datafusion/functions" }
#datafusion-functions-aggregate = { version = "54", path = "../andts-datafusion/datafusion/functions-aggregate" }
#datafusion-sql = { version = "54", path = "../andts-datafusion/datafusion/sql" }
derive-getters = "0.5.0"
derive_builder = "0.20"
futures = "0.3.31"
getrandom = { version = "0.4.2", features = ["std"] }
itertools = "0.14.0"
lazy_static = "1.5.0"
lru = "0.18.0"
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }
murmur3 = { version = "0.5.2" }
parquet = { version = "58", features = ["async", "object_store"] }
pin-project-lite = "0.2"
regex = "1.11.1"
serde = "^1.0"
serde_derive = "^1.0"
serde_json = "^1.0"
sqlparser = { version = "0.62", features = ["visitor"] }
thiserror = "2"
tracing = "0.1"
tracing-futures = "0.2"
url = "^2.5"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
